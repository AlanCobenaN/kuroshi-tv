name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./kuroshi_app/backend
          target: production
          push: true
          tags: ghcr.io/alancobenam/kuroshi-tv-backend:latest

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./kuroshi_app/frontend
          push: true
          tags: ghcr.io/alancobenam/kuroshi-tv-frontend:latest

