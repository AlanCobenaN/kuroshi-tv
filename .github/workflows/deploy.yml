name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./kuroshi_app/backend
          target: production
          push: true
          tags: ghcr.io/alancobenan/kuroshi-tv-backend:latest

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./kuroshi_app/frontend
          push: true
          tags: ghcr.io/alancobenan/kuroshi-tv-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/backend
            NEXT_PUBLIC_SITE_URL=https://kuroshi.lat
            NEXT_PUBLIC_SUPABASE_URL=https://bvhrrbfxwzygfkqbavwb.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            NEXTAUTH_URL=https://kuroshi.lat
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/kuroshi-tv/kuroshi_app
            git pull origin main
            docker compose pull
            docker compose up -d
            docker system prune -af
