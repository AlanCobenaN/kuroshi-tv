<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#c42d3a"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:0"/>
    </linearGradient>
    <!-- Patrón de puntos sutil -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="400" fill="url(#bg1)"/>
  <rect width="600" height="400" fill="url(#dots)"/>

  <!-- Glow superior izquierdo -->
  <ellipse cx="80" cy="80" rx="160" ry="120" fill="url(#glow1)" opacity="0.6"/>

  <!-- Línea decorativa izquierda -->
  <rect x="48" y="60" width="2" height="280" fill="#e63946" opacity="0.3"/>
  <rect x="48" y="60" width="2" height="60" fill="#e63946"/>

  <!-- Eyebrow -->
  <text x="68" y="95" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#e63946" text-anchor="start" text-transform="uppercase">KUROSHI.LAT</text>

  <!-- Headline principal -->
  <text x="68" y="158" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="#f0eff4" letter-spacing="-1.5">Ve anime.</text>
  <text x="68" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="#f0eff4" letter-spacing="-1.5">Vive el</text>
  <text x="68" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="url(#accent1)" letter-spacing="-1.5">fandom.</text>

  <!-- Subtexto -->
  <text x="68" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9190a0" letter-spacing="0.2">Comunidades, chat en tiempo real y tu lista</text>
  <text x="68" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9190a0" letter-spacing="0.2">personal. Todo en un solo lugar.</text>

  <!-- CTA Button -->
  <rect x="68" y="350" width="160" height="36" rx="6" fill="url(#accent1)"/>
  <text x="148" y="373" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Regístrate gratis</text>

  <!-- Elemento decorativo derecho — caracteres japoneses difuminados -->
  <text x="460" y="180" font-family="serif" font-size="120" fill="#ffffff" opacity="0.03" text-anchor="middle">黒</text>
  <text x="520" y="300" font-family="serif" font-size="80" fill="#e63946" opacity="0.06" text-anchor="middle">死</text>

  <!-- Borde sutil -->
  <rect width="600" height="400" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
</svg>
