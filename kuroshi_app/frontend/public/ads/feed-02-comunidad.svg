<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d14"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="amber2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4a261"/>
      <stop offset="100%" style="stop-color:#e07b3c"/>
    </linearGradient>
    <clipPath id="clip2">
      <rect width="600" height="400"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="400" fill="url(#bg2)"/>

  <!-- Grid sutil de fondo -->
  <line x1="0" y1="133" x2="600" y2="133" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
  <line x1="0" y1="266" x2="600" y2="266" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>
  <line x1="400" y1="0" x2="400" y2="400" stroke="#ffffff" stroke-width="0.5" opacity="0.03"/>

  <!-- Bloque de color amber — esquina superior derecha -->
  <rect x="440" y="0" width="160" height="160" fill="#f4a261" opacity="0.04"/>

  <!-- Número grande decorativo -->
  <text x="520" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-size="200" font-weight="900" fill="#f4a261" opacity="0.04" text-anchor="middle">+</text>

  <!-- Eyebrow con línea -->
  <rect x="48" y="72" width="28" height="2" fill="#f4a261"/>
  <text x="84" y="86" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#f4a261">COMUNIDADES</text>

  <!-- Headline -->
  <text x="48" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#f0eff4" letter-spacing="-1">Tu fandom</text>
  <text x="48" y="204" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#f0eff4" letter-spacing="-1">merece su</text>
  <text x="48" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="url(#amber2)" letter-spacing="-1">propio lugar.</text>

  <!-- Descripción -->
  <text x="48" y="294" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9190a0">Crea una comunidad no oficial. Invita fans.</text>
  <text x="48" y="314" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#9190a0">Alcanza 1000 miembros → comunidad oficial.</text>

  <!-- Barra de progreso decorativa -->
  <rect x="48" y="332" width="320" height="4" rx="2" fill="#18181f"/>
  <rect x="48" y="332" width="214" height="4" rx="2" fill="url(#amber2)"/>
  <text x="48" y="352" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#4e4d5c">847 / 1000 miembros para ser oficial</text>

  <!-- CTA -->
  <rect x="48" y="362" width="196" height="26" rx="5" fill="none" stroke="#f4a261" stroke-width="1.5"/>
  <text x="146" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#f4a261" text-anchor="middle" letter-spacing="0.3">Crear comunidad →</text>

  <!-- Borde -->
  <rect width="600" height="400" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
</svg>
