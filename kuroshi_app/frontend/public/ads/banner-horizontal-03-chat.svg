<svg xmlns="http://www.w3.org/2000/svg" width="728" height="90" viewBox="0 0 728 90">
  <defs>
    <linearGradient id="bgH3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="redH3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#c42d3a"/>
    </linearGradient>
  </defs>

  <rect width="728" height="90" fill="url(#bgH3)"/>

  <!-- Burbujas de chat decorativas — izquierda -->
  <rect x="20" y="14" width="100" height="22" rx="11" fill="#18181f"/>
  <text x="70" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9190a0" text-anchor="middle">@otaku: WOW</text>

  <rect x="20" y="42" width="120" height="22" rx="11" fill="#1f1f28"/>
  <text x="80" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9190a0" text-anchor="middle">@fan: ¡¡EPIC!!</text>

  <rect x="20" y="64" width="90" height="18" rx="9" fill="#e63946" opacity="0.15"/>
  <text x="65" y="78" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#e63946" text-anchor="middle">min 14 · 23 likes</text>

  <!-- Separador -->
  <line x1="158" y1="15" x2="158" y2="75" stroke="#1f1f28" stroke-width="1"/>

  <!-- Headline central -->
  <text x="178" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f0eff4" letter-spacing="-0.5">Comenta al minuto exacto</text>
  <text x="178" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#f0eff4" letter-spacing="-0.5"> </text>
  <text x="178" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9190a0">El chat que se mueve con el video. Solo en <tspan font-weight="800" fill="#f0eff4">Kuroshi.lat</tspan></text>

  <!-- Separador 2 -->
  <line x1="556" y1="15" x2="556" y2="75" stroke="#1f1f28" stroke-width="1"/>

  <!-- Logo + CTA -->
  <text x="572" y="37" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="900" fill="#f0eff4" letter-spacing="-0.3">kuro<tspan fill="#e63946">shi</tspan><tspan fill="#4e4d5c" font-size="13" font-weight="400">.lat</tspan></text>

  <rect x="572" y="48" width="130" height="26" rx="5" fill="url(#redH3)"/>
  <text x="637" y="65" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Ver episodio ahora</text>

  <rect width="728" height="90" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
