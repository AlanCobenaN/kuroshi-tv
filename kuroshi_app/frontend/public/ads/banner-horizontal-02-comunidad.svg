<svg xmlns="http://www.w3.org/2000/svg" width="728" height="90" viewBox="0 0 728 90">
  <defs>
    <linearGradient id="bgH2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0d0d14"/>
    </linearGradient>
    <linearGradient id="amberH2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4a261"/>
      <stop offset="100%" style="stop-color:#e07b3c"/>
    </linearGradient>
    <linearGradient id="fadeAmber" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f4a261;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#f4a261;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="728" height="90" fill="url(#bgH2)"/>
  <rect x="468" y="0" width="260" height="90" fill="url(#fadeAmber)"/>

  <!-- Línea inferior accent -->
  <rect x="0" y="88" width="728" height="2" fill="url(#amberH2)" opacity="0.6"/>

  <!-- Logo -->
  <text x="28" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#f0eff4" letter-spacing="-0.5">kuro<tspan fill="#e63946">shi</tspan><tspan font-size="16" font-weight="400" fill="#4e4d5c">.lat</tspan></text>

  <line x1="145" y1="22" x2="145" y2="68" stroke="#1f1f28" stroke-width="1"/>

  <!-- Mensaje principal -->
  <text x="165" y="37" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#f0eff4" letter-spacing="-0.5">Crea tu comunidad de fans.</text>
  <text x="165" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#9190a0">Llega a 1000 miembros y se vuelve <tspan font-weight="700" fill="#f4a261">oficial</tspan>.</text>

  <line x1="500" y1="22" x2="500" y2="68" stroke="#1f1f28" stroke-width="1"/>

  <!-- Barra de progreso ilustrativa -->
  <text x="516" y="37" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#4e4d5c" letter-spacing="1">PROGRESO EJEMPLO</text>
  <rect x="516" y="44" width="160" height="5" rx="2.5" fill="#18181f"/>
  <rect x="516" y="44" width="107" height="5" rx="2.5" fill="url(#amberH2)"/>
  <text x="516" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#9190a0">847 / 1000 miembros</text>

  <!-- CTA -->
  <rect x="628" y="22" width="76" height="46" rx="7" fill="none" stroke="#f4a261" stroke-width="1.5"/>
  <text x="666" y="49" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#f4a261" text-anchor="middle">Crear →</text>

  <rect width="728" height="90" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
</svg>
