<svg xmlns="http://www.w3.org/2000/svg" width="728" height="90" viewBox="0 0 728 90">
  <defs>
    <linearGradient id="bgH1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="70%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="redH1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#c42d3a"/>
    </linearGradient>
    <linearGradient id="fadeH1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.12"/>
      <stop offset="40%" style="stop-color:#e63946;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="728" height="90" fill="url(#bgH1)"/>
  <rect width="260" height="90" fill="url(#fadeH1)"/>

  <!-- Línea superior accent -->
  <rect x="0" y="0" width="728" height="2" fill="url(#redH1)" opacity="0.8"/>

  <!-- Logo -->
  <text x="28" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="900" fill="#f0eff4" letter-spacing="-0.5">kuro<tspan fill="#e63946">shi</tspan><tspan font-size="16" font-weight="400" fill="#4e4d5c">.lat</tspan></text>

  <!-- Separador vertical -->
  <line x1="145" y1="22" x2="145" y2="68" stroke="#1f1f28" stroke-width="1"/>

  <!-- Tagline -->
  <text x="165" y="40" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#f0eff4" letter-spacing="-0.3">Anime + comunidad,</text>
  <text x="165" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#9190a0">todo en un lugar. Gratis.</text>

  <!-- Separador 2 -->
  <line x1="420" y1="22" x2="420" y2="68" stroke="#1f1f28" stroke-width="1"/>

  <!-- Feature pills -->
  <rect x="438" y="26" width="78" height="18" rx="9" fill="#18181f" stroke="#25252f" stroke-width="1"/>
  <text x="477" y="39" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#9190a0" text-anchor="middle">Chat en vivo</text>

  <rect x="524" y="26" width="74" height="18" rx="9" fill="#18181f" stroke="#25252f" stroke-width="1"/>
  <text x="561" y="39" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#9190a0" text-anchor="middle">Comunidades</text>

  <rect x="438" y="50" width="68" height="18" rx="9" fill="#18181f" stroke="#25252f" stroke-width="1"/>
  <text x="472" y="63" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#9190a0" text-anchor="middle">Tu lista</text>

  <rect x="514" y="50" width="84" height="18" rx="9" fill="#18181f" stroke="#25252f" stroke-width="1"/>
  <text x="556" y="63" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#9190a0" text-anchor="middle">Sin anuncios pop</text>

  <!-- CTA -->
  <rect x="622" y="22" width="82" height="46" rx="7" fill="url(#redH1)"/>
  <text x="663" y="42" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Regístrate</text>
  <text x="663" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">Es gratis</text>

  <!-- Borde -->
  <rect width="728" height="90" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
</svg>
