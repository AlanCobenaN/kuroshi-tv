<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600">
  <defs>
    <linearGradient id="bgV1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="redV1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#c42d3a"/>
    </linearGradient>
    <linearGradient id="glowV1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="160" height="600" fill="url(#bgV1)"/>

  <!-- Glow superior -->
  <ellipse cx="80" cy="0" rx="120" ry="100" fill="url(#glowV1)"/>

  <!-- Línea izquierda accent -->
  <rect x="0" y="0" width="3" height="600" fill="url(#redV1)" opacity="0.6"/>

  <!-- Logo vertical -->
  <text x="80" y="56" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#f0eff4" text-anchor="middle" letter-spacing="-0.5">kuro</text>
  <text x="80" y="80" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#e63946" text-anchor="middle" letter-spacing="-0.5">shi</text>
  <text x="80" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#4e4d5c" text-anchor="middle">.lat</text>

  <!-- Separador -->
  <rect x="20" y="116" width="120" height="1" fill="#1f1f28"/>

  <!-- Headline vertical -->
  <text x="80" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#f0eff4" text-anchor="middle" letter-spacing="-1">Ve</text>
  <text x="80" y="192" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#f0eff4" text-anchor="middle" letter-spacing="-1">anime.</text>
  <text x="80" y="236" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#9190a0" text-anchor="middle" letter-spacing="-1">Vive</text>
  <text x="80" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#9190a0" text-anchor="middle" letter-spacing="-1">el</text>
  <text x="80" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#e63946" text-anchor="middle" letter-spacing="-1">fandom.</text>

  <!-- Separador 2 -->
  <rect x="20" y="324" width="120" height="1" fill="#1f1f28"/>

  <!-- Features list -->
  <circle cx="28" cy="350" r="3" fill="#e63946"/>
  <text x="38" y="355" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9190a0">Chat por minuto</text>

  <circle cx="28" cy="374" r="3" fill="#e63946"/>
  <text x="38" y="379" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9190a0">Comunidades</text>

  <circle cx="28" cy="398" r="3" fill="#e63946"/>
  <text x="38" y="403" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9190a0">Tu lista personal</text>

  <circle cx="28" cy="422" r="3" fill="#e63946"/>
  <text x="38" y="427" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#9190a0">100% gratis</text>

  <!-- Separador 3 -->
  <rect x="20" y="446" width="120" height="1" fill="#1f1f28"/>

  <!-- Stats -->
  <text x="80" y="484" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#f0eff4" text-anchor="middle" letter-spacing="-1">12k+</text>
  <text x="80" y="504" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" fill="#4e4d5c" text-anchor="middle" letter-spacing="1.5">OTAKUS ACTIVOS</text>

  <!-- CTA -->
  <rect x="16" y="530" width="128" height="40" rx="7" fill="url(#redV1)"/>
  <text x="80" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Regístrate</text>
  <text x="80" y="562" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Es gratis siempre</text>

  <!-- Borde -->
  <rect width="160" height="600" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
</svg>
