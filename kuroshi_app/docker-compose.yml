services:
  postgres:
    image: postgres:15-alpine
    container_name: kuroshi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuroshi
      POSTGRES_PASSWORD: tlxHagmyKGJLqvws0oA6rpWDd52hQZzT
      POSTGRES_DB: kuroshi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kuroshi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuroshi -d kuroshi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/alancobenam/kuroshi-tv-backend:latest
    container_name: kuroshi_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    networks:
      - kuroshi_network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/alancobenam/kuroshi-tv-frontend:latest
    container_name: kuroshi_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    ports:
      - "3000:3000"
    networks:
      - kuroshi_network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  kuroshi_network:
    driver: bridge
