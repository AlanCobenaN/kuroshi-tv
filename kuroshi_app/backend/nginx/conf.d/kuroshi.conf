# ─────────────────────────────────────────────────────────────
# kuroshi.conf — Desarrollo local
# En producción (VPS) este archivo se actualiza con el dominio
# real y los bloques SSL que provee Cloudflare.
# ─────────────────────────────────────────────────────────────

upstream backend_api {
    server backend:4000;
}

upstream frontend_app {
    server frontend:3000;         # el frontend se añade en su momento
}

server {
    listen 80;
    server_name localhost kuroshi.lat www.kuroshi.lat;

    # ── API REST ─────────────────────────────────────────────
    location /api/ {
        proxy_pass            http://backend_api;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection 'upgrade';
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_cache_bypass    $http_upgrade;
        proxy_read_timeout    300s;
        proxy_connect_timeout 30s;
    }

    # ── Supabase Studio (solo desarrollo, bloquear en prod) ──
    location /supabase/ {
        proxy_pass         http://supabase-kong:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Frontend Next.js ─────────────────────────────────────
    location / {
        proxy_pass         http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}